services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sql_agent_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/sample.db:/app/sample.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sql_agent_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
